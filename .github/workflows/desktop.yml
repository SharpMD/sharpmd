# Builds the desktop app (Windows, macOS, Linux) and attaches the installers to a GitHub release.
# Run it from the Actions tab, or push a tag like desktop-v2.92.0.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: SharpMD __VERSION__ for Windows, macOS and Linux
          releaseBody: Unsigned builds. Windows may show SmartScreen (More info, Run anyway); on macOS right click the app and choose Open the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Unsigned MSIX for the Microsoft Store (the Store signs it). Runs once the repository variables
  # MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER and MSSTORE_PUBLISHER_NAME hold the values from
  # Partner Center, Product identity. Upload the artifact in Partner Center.
  store:
    if: vars.MSSTORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Build the exe
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Pack the MSIX
        shell: pwsh
        run: desktop/msix/pack.ps1 -IdentityName '${{ vars.MSSTORE_IDENTITY_NAME }}' -Publisher '${{ vars.MSSTORE_PUBLISHER }}' -PublisherName '${{ vars.MSSTORE_PUBLISHER_NAME }}' -Out SharpMD.msix
      - uses: actions/upload-artifact@v4
        with:
          name: SharpMD-msix
          path: SharpMD.msix
