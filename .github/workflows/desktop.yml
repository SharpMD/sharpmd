# Builds the desktop app (Windows, macOS, Linux) and attaches the installers to a GitHub release.
# Run it from the Actions tab, or push a tag like desktop-v2.92.0.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles and latest.json, which the installed app checks on launch.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: SharpMD __VERSION__ for Windows, macOS and Linux
          releaseBody: "Not signed by Apple or Microsoft. Windows: if SmartScreen appears, More info, Run anyway. macOS: open the app once, then System Settings, Privacy & Security, Open Anyway."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The three builds each write latest.json and can overwrite each other. This rebuilds it from every signed asset.
  updater-json:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Rebuild latest.json
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sig' -p latest.json -D rel
          cd rel
          node -e '
            const fs = require("fs"), j = JSON.parse(fs.readFileSync("latest.json"));
            const base = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/" + process.env.TAG + "/";
            const add = (keys, f) => { if (!fs.existsSync(f + ".sig")) return; for (const k of keys) j.platforms[k] = { signature: fs.readFileSync(f + ".sig", "utf8").trim(), url: base + f }; };
            for (const f of fs.readdirSync(".").filter(f => f.endsWith(".sig")).map(f => f.slice(0, -4))) {
              if (f.endsWith(".AppImage")) add(["linux-x86_64", "linux-x86_64-appimage"], f);
              else if (f.endsWith(".deb")) add(["linux-x86_64-deb"], f);
              else if (f.endsWith(".rpm")) add(["linux-x86_64-rpm"], f);
            }
            fs.writeFileSync("latest.json", JSON.stringify(j, null, 2));
            console.log(Object.keys(j.platforms).join(" "));
          '
          gh release upload "$TAG" latest.json --clobber -R "$GITHUB_REPOSITORY"

  # Unsigned MSIX for the Microsoft Store (the Store signs it). Runs once the repository variables
  # MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER and MSSTORE_PUBLISHER_NAME hold the values from
  # Partner Center, Product identity. Upload the artifact in Partner Center.
  store:
    if: vars.MSSTORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Build the exe
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Pack the MSIX
        shell: pwsh
        run: desktop/msix/pack.ps1 -IdentityName '${{ vars.MSSTORE_IDENTITY_NAME }}' -Publisher '${{ vars.MSSTORE_PUBLISHER }}' -PublisherName '${{ vars.MSSTORE_PUBLISHER_NAME }}' -Out SharpMD.msix
      - uses: actions/upload-artifact@v4
        with:
          name: SharpMD-msix
          path: SharpMD.msix
